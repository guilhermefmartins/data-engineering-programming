[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-engineering-programming"
version = "0.1.0"
description = "Pipeline PySpark de pedidos x pagamentos (FIAP - Data Engineering Programming)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Guilherme Martins", email = "guiziinho.fm@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "pyspark>=3.5.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
data-engineering-programming = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
